<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Web Flores Timur</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-search@2.9.6/dist/leaflet-search.min.css" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">



    <style>
        /* Custom navy color for the navbar */
        .bg-pink {
            background-color: #000e38;
            /* Navy */
        } 

        /* Adjust layout to accommodate navbar */
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        #map {
            flex-grow: 1;
            /* Map fills remaining vertical space */
            width: 100%;
        }

        .legend {
            background-color: white;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }

        .legend-container {
            padding-left: 20px;
            padding-top: 5px;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-pink">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Peta Flores Timur</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#aboutModal">Tentang</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- About Modal -->
    <div class="modal fade" id="aboutModal" tabindex="-1" aria-labelledby="aboutModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="aboutModalLabel">Tentang</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Nama : Anissa Syawalini Putri Alamsyah</p>
                    <p>NIM : 24/544263/SV/25365</p>
                </div>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-search@2.9.6/dist/leaflet-search.min.js"></script>

    <!-- Bootstrap JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 1. Inisialisasi Peta
        var map = L.map('map').setView([-8.3430, 122.9814], 11);

        // Membuat pane
        map.createPane('batasKecamatanPane');
        map.getPane('batasKecamatanPane').style.zIndex = 420;
        map.createPane('sungaiPane');
        map.getPane('sungaiPane').style.zIndex = 430;
        map.createPane('jalanPane');
        map.getPane('jalanPane').style.zIndex = 440;
        map.createPane('toponimiPane');
        map.getPane('toponimiPane').style.zIndex = 450;

        // 2. Menambahkan Base Map (Peta Dasar)
        var openStreetMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        var esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        });

        // 3. Menambahkan Layer Group
        var batasKecamatanLayer = L.layerGroup().addTo(map);
        var jalanLayer = L.layerGroup().addTo(map);
        var sungaiLayer = L.layerGroup().addTo(map);
        var toponimiLayer = L.layerGroup().addTo(map);

        // 4. Menambahkan Layer Batas Kecamatan dengan Simbologi Graduated
        fetch('DATA/batas_kecamatan.geojson')
            .then(response => response.json())
            .then(data => {
                var batasKecamatanGeoJSON = L.geoJSON(data, {
                    pane: 'batasKecamatanPane',
                    style: function (feature) {
                        var penduduk = feature.properties.Penduduk;
                        return {
                            fillColor: getColor(penduduk),
                            weight: 2,
                            opacity: 1,
                            color: 'black',
                            dashArray: '3',
                            fillOpacity: 0.7
                        };
                    },
                    onEachFeature: function (feature, layer) {
                        var popupContent = `
        <div class="card shadow-sm" style="width: 18rem;">
            <div class="card-body">
                <h5 class="card-title text-dark">${feature.properties.WADMKC}</h5>
                <p class="card-text mb-1"><b>Jumlah Penduduk:</b> ${feature.properties.Penduduk}</p>
            </div>
        </div>`;

                        layer.bindPopup(popupContent, {
                            autoPan: true,         // otomatis geser peta supaya popup selalu terlihat
                            direction: "top",      // posisi popup di atas
                            offset: L.point(0, -10) // geser sedikit ke atas biar rapi
                        });
                        layer.bindTooltip(feature.properties.WADMKC, {
                            sticky: true
                        });
                    }
                }).addTo(batasKecamatanLayer);

                var searchControl = new L.Control.Search({
                    layer: batasKecamatanGeoJSON,
                    propertyName: 'WADMKC',
                    marker: false,
                    moveToLocation: function (latlng, title, map) {
                        map.setView(latlng, 13);
                    }
                });

                map.addControl(searchControl);
            });

        // Menambahkan Layer Jalan
        fetch('DATA/jalan.geojson')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    pane: 'jalanPane',
                    style: function (feature) {
                        var namaUnsur = feature.properties.NAMA_UNSUR;
                        var weight = 2; // Default weight
                        if (namaUnsur === 'Jalan Propinsi') {
                            weight = 5;
                        } else if (namaUnsur === 'Jalan Kabupaten') {
                            weight = 3;
                        } else if (namaUnsur === 'Jalan Lain') {
                            weight = 1;
                        }
                        return {
                            color: 'red',
                            weight: weight
                        };
                    }
                }).addTo(jalanLayer);
            });

        // Menambahkan Layer Sungai
        fetch('DATA/sungai.geojson')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    pane: 'sungaiPane',
                    style: {
                        color: 'blue',
                        weight: 2
                    }
                }).addTo(sungaiLayer);
            });

        // Menambahkan Layer Toponimi
        fetch('DATA/toponimi.geojson')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    pane: 'toponimiPane',
                    onEachFeature: function (feature, layer) {
                        layer.bindPopup(feature.properties.TOPONIMI);
                    }
                }).addTo(toponimiLayer);
            });

        function getColor(p) {
            return p > 30000 ? '#5e2c04' :
                p > 15000 ? '#8b4513' :
                    '#d2b48c';
        }

        // 5. Menambahkan Kontrol Layer
        var baseMaps = {
            "OpenStreetMap": openStreetMap,
            "Esri Satellite": esriSatellite
        };

        var batasKecamatanLegend = "<div class='legend-item'><div class='legend-color' style='background:#5e2c04'></div><span>30000+</span></div><div class='legend-item'><div class='legend-color' style='background:#8b4513'></div><span>15000–30000</span></div><div class='legend-item'><div class='legend-color' style='background:#d2b48c'></div><span>0–15000</span></div>";
        var jalanLegend = '<div class="legend-item"><div style="background: red; width: 20px; height: 5px; margin-right: 10px;"></div><span>Jalan Propinsi</span></div><div class="legend-item"><div style="background: red; width: 20px; height: 3px; margin-right: 10px;"></div><span>Jalan Kabupaten</span></div><div class="legend-item"><div style="background: red; width: 20px; height: 1px; margin-right: 10px;"></div><span>Jalan Lain</span></div>';
        var sungaiLegend = '<div class="legend-item"><div style="background: blue; width: 20px; height: 2px; margin-right: 10px;"></div><span>Sungai</span></div>';

        var overlayMaps = {
            ["Batas Kecamatan<br><div class='legend-container'>" + batasKecamatanLegend + "</div>"]: batasKecamatanLayer,
            ["Jalan<br><div class='legend-container'>" + jalanLegend + "</div>"]: jalanLayer,
            ["Sungai<br><div class='legend-container'>" + sungaiLegend + "</div>"]: sungaiLayer,
            "Toponimi": toponimiLayer
        };

        L.control.layers(baseMaps, overlayMaps, { collapsed: window.innerWidth < 768 }).addTo(map);

    </script>

</body>

</html>
